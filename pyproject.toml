[project]
name = "ecosort-ai"
version = "1.0.0"
description = "EcoSort-AI — Real-time garbage detection and classification using YOLO26"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.41.0",
    "ultralytics>=8.4.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]

[project.scripts]
ecosort = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["model", "src", "app", "config"]
omit   = ["tests/*", "notebooks/*"]
